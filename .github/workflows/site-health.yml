name: Site health

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check internal links and assets
        run: node scripts/check-site-health.mjs
      - name: Check important public links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-site-health.mjs --external
